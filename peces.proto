// Definicion basica del archivo + los datos del pez
syntax = "proto3";
// Definicion del paquete para organizar los mensajes y servicios relacionados con los peces.
package peces;

// Aqui se define la estrucutra del pez, con sus atributos basicos.
// Se le asigna ascendentemente un numero a cada campo, para identificarlo 
// de forma univocamente en la serializacion de los mensajes.
message Pez {
  string id = 1;
  string nombre_comun = 2;
  string especie = 3;
  string descripcion = 4;
  double precio = 5;
  int32 stock = 6; // int32 tiene la capacidad de almacenar números enteros de hasta 2,147,483,647.
  repeated string categoria = 7; // Listas de categorías (ej: costa, zona_hadal, oceanico)
  repeated string estado = 8; // Listas de estados (ej: ornamental, consumo)
  // se usa repeated para permitir que un pez pueda pertenecer a multiples categorias y estados.
  string imagen_url = 9;
  bool activo = 10; // Para marcar si el pez esta activo o no (en caso de eliminación lógica)
}

// Peticiones y Respuestas del CRUD
// Se llaman desde el cliente para realizar las operaciones correspondientes en el servidor,
// y se definen los campos necesarios para cada operación.
message CreatePezRequest {
  string nombre_comun = 1;
  string especie = 2;
  string descripcion = 3;
  double precio = 4;
  int32 stock = 5;
  repeated string categoria = 6;
  repeated string estado = 7;
  string imagen_url = 8;
}
message ReadPezRequest { string id = 1; }
message UpdatePezRequest { Pez pez = 1; }
message DeletePezRequest { string id = 1; }
message DeletePezResponse { bool success = 1; string mensaje = 2; }

// Definición del servicio gRPC con los métodos para CRUD de peces exoticos
// Cada metodo corresponde a una operacion CRUD y usa los mensajes definidos anteriormente para las solicitudes y respuestas.
service PezService {
  rpc CreatePez (CreatePezRequest) returns (Pez);
  rpc ReadPez (ReadPezRequest) returns (Pez);
  rpc UpdatePez (UpdatePezRequest) returns (Pez);
  rpc DeletePez (DeletePezRequest) returns (DeletePezResponse);
}